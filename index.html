<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planr — Smart Timetable</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%23e54d2e'/%3E%3Crect x='10' y='6' width='3' height='6' rx='1.5' fill='white'/%3E%3Crect x='21' y='6' width='3' height='6' rx='1.5' fill='white'/%3E%3Crect x='5' y='10' width='24' height='19' rx='3' fill='white' fill-opacity='.15'/%3E%3Crect x='5' y='10' width='24' height='5' rx='2' fill='white' fill-opacity='.25'/%3E%3Crect x='9' y='20' width='3' height='3' rx='1' fill='white' fill-opacity='.9'/%3E%3Crect x='15.5' y='20' width='3' height='3' rx='1' fill='white' fill-opacity='.9'/%3E%3Crect x='22' y='20' width='3' height='3' rx='1' fill='white' fill-opacity='.4'/%3E%3Crect x='9' y='26' width='3' height='3' rx='1' fill='white' fill-opacity='.5'/%3E%3Crect x='15.5' y='26' width='3' height='3' rx='1' fill='white' fill-opacity='.9'/%3E%3Crect x='22' y='26' width='3' height='3' rx='1' fill='white' fill-opacity='.9'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface2: #f2f0ec;
  --border: rgba(0,0,0,0.07);
  --border2: rgba(0,0,0,0.12);
  --ink: #1c1917;
  --ink2: #57534e;
  --ink3: #a8a29e;
  --accent: #e54d2e;
  --accent-l: #fff0ed;
  --accent-d: #c1320f;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --sb: 260px;
  --font: 'DM Sans', sans-serif;
  --font-serif: 'DM Serif Display', serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-tap-highlight-color: transparent; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── LAYOUT ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sb); flex-shrink: 0; background: var(--ink);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  position: relative; z-index: 100;
}
.sb-logo {
  padding: 24px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.06);
}
.logo-row { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 34px; height: 34px; flex-shrink: 0; display: block;
}
.logo-name { font-family: var(--font-serif); font-size: 1.3rem; color: #fff; letter-spacing: -.01em; }

/* Mini calendar */
.mini-cal { padding: 16px 16px 10px; border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
.mc-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.mc-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.35); }
.mc-btn { background: none; border: none; color: rgba(255,255,255,.3); cursor: pointer; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all .15s; }
.mc-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
.mc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.mc-dlbl { text-align: center; font-size: 9px; font-weight: 600; color: rgba(255,255,255,.2); padding: 2px 0; }
.mc-day {
  height: 24px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500; color: rgba(255,255,255,.4);
  border-radius: 6px; cursor: pointer; transition: all .12s; position: relative;
}
.mc-day:hover { background: rgba(255,255,255,.08); color: #fff; }
.mc-day.out { color: rgba(255,255,255,.12); pointer-events: none; }
.mc-day.today { background: var(--accent); color: #fff !important; font-weight: 600; }
.mc-day.sel { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
.mc-day.has::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; background: var(--accent); border-radius: 50%; }
.mc-day.today.has::after { background: rgba(255,255,255,.7); }

/* Sidebar nav */
.sb-nav { padding: 12px 12px; flex: 1; overflow-y: auto; }
.sb-section { margin-bottom: 20px; }
.sb-label { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.2); padding: 0 8px 8px; display: block; }
.sb-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none;
  color: rgba(255,255,255,.5); padding: 9px 10px; border-radius: 9px;
  font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
  text-align: left; transition: all .12s; margin-bottom: 1px;
}
.sb-btn i { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.sb-btn:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.85); }
.sb-btn.on { background: rgba(255,255,255,.12); color: #fff; }

/* Category list */
.cat-item { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.cat-item:hover { background: rgba(255,255,255,.06); }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cat-name { font-size: 12px; color: rgba(255,255,255,.45); font-weight: 500; flex: 1; }
.cat-count { font-size: 10px; color: rgba(255,255,255,.2); font-weight: 600; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 10px; }

/* Add button */
.sb-bottom { padding: 12px; border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0; }
.btn-add-sb {
  width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
  padding: 11px 16px; font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .18s;
}
.btn-add-sb:hover { background: var(--accent-d); transform: translateY(-1px); }
.btn-add-sb:active { transform: none; }

/* ── MAIN ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* ── TOPBAR ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 22px; height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
}
.tb-left { display: flex; align-items: center; gap: 10px; }
.tb-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 9px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink2); font-size: 14px; transition: all .13s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.nav-btn {
  width: 30px; height: 30px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink2); font-size: 12px; transition: all .13s; flex-shrink: 0;
}
.nav-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.date-info { min-width: 0; }
.date-h { font-family: var(--font-serif); font-size: 1.1rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.date-s { font-size: 11px; color: var(--ink3); margin-top: 0; }
.btn-today {
  background: none; border: 1px solid var(--border2); color: var(--ink2);
  border-radius: 8px; padding: 5px 12px; font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: var(--font); transition: all .13s; white-space: nowrap;
}
.btn-today:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-primary {
  background: var(--accent); color: #fff; border: none; border-radius: 9px;
  padding: 7px 16px; font-size: 12px; font-weight: 600; font-family: var(--font);
  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .17s; white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-d); transform: translateY(-1px); }
.btn-secondary {
  background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; border-radius: 9px;
  padding: 7px 14px; font-size: 12px; font-weight: 600; font-family: var(--font);
  cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .17s; white-space: nowrap;
}
.btn-secondary:hover { background: #16a34a; color: #fff; border-color: #16a34a; }

/* ── VIEW STRIP ── */
.view-strip {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; padding: 0 20px; gap: 0; flex-shrink: 0;
}
.v-tab {
  padding: 11px 18px; font-size: 12px; font-weight: 600; cursor: pointer;
  border: none; background: none; color: var(--ink3); border-bottom: 2px solid transparent;
  transition: all .13s; font-family: var(--font); display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.v-tab:hover { color: var(--ink); }
.v-tab.on { color: var(--accent); border-bottom-color: var(--accent); }

/* ── CONTENT ── */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 18px 20px; gap: 0; }
.panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.panel.on { display: flex; }

/* ══════════ DAY VIEW ══════════ */
.day-layout {
  flex: 1; overflow: hidden; display: flex; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.day-time {
  width: 58px; flex-shrink: 0; overflow-y: auto; overflow-x: hidden;
  background: var(--surface2); border-right: 1px solid var(--border);
}
.tl {
  height: 64px; display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 6px 10px 0; font-size: 9px; font-weight: 600; color: var(--ink3);
  letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,.04);
}
.day-ev {
  flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
}
.dhr {
  height: 64px; border-bottom: 1px solid rgba(0,0,0,.04); cursor: pointer;
  transition: background .1s; position: relative;
}
.dhr:hover { background: rgba(229,77,46,.02); }
.dhr-half { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(0,0,0,.04); pointer-events: none; }
.ev-block {
  position: absolute; left: 8px; right: 8px; border-radius: 9px;
  padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  overflow: hidden; transition: all .15s; z-index: 2;
  border-left: 3px solid rgba(0,0,0,.15);
}
.ev-block:hover { transform: translateX(2px); box-shadow: var(--shadow); }
.ev-block .ev-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-block .ev-time { font-size: 10px; font-weight: 400; opacity: .7; display: block; margin-top: 2px; }
.now-line {
  position: absolute; left: 0; right: 0; height: 1.5px; background: var(--accent); z-index: 5; pointer-events: none;
}
.now-line::before {
  content: ''; position: absolute; left: -4px; top: -4px;
  width: 9px; height: 9px; background: var(--accent); border-radius: 50%;
}
.empty-hint {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: none; gap: 10px; opacity: .4;
}
.empty-hint i { font-size: 2rem; color: var(--ink3); }
.empty-hint p { font-size: 12px; color: var(--ink3); text-align: center; }

/* ══════════ WEEK VIEW ══════════ */
.week-layout {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.wk-head {
  display: grid; grid-template-columns: 58px repeat(7, 1fr);
  border-bottom: 1px solid var(--border); background: var(--surface2); flex-shrink: 0;
}
.wk-hd0 { background: var(--surface2); border-right: 1px solid var(--border); }
.wk-hdcell {
  padding: 10px 6px; text-align: center; border-right: 1px solid var(--border);
  font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3);
}
.wk-hdcell:last-child { border-right: none; }
.wk-num { display: block; font-family: var(--font-serif); font-size: 1.1rem; font-weight: 400; color: var(--ink); margin-top: 2px; }
.wk-hdcell.is-today { color: var(--accent); }
.wk-hdcell.is-today .wk-num { background: var(--accent); color: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; margin: 2px auto 0; font-size: 1rem; }
.wk-scroll { flex: 1; overflow-y: auto; }
.wk-grid { display: grid; grid-template-columns: 58px repeat(7, 1fr); }
.wk-tl { height: 52px; display: flex; align-items: flex-start; padding: 5px 8px 0; justify-content: flex-end; font-size: 9px; font-weight: 600; color: var(--ink3); letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,.04); }
.wk-cell { height: 52px; border-right: 1px solid rgba(0,0,0,.04); border-bottom: 1px solid rgba(0,0,0,.04); cursor: pointer; position: relative; transition: background .1s; }
.wk-cell:last-child { border-right: none; }
.wk-cell:hover { background: rgba(229,77,46,.02); }
.wk-ev {
  position: absolute; left: 2px; right: 2px; border-radius: 5px;
  padding: 2px 5px; font-size: 9px; font-weight: 600; cursor: pointer;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; z-index: 2;
  border-left: 2px solid rgba(0,0,0,.15);
}
.wk-ev:hover { filter: brightness(.93); }

/* ══════════ MONTH VIEW ══════════ */
.month-layout {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.month-head {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.m-dlbl { padding: 8px 4px; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; overflow-y: auto; }
.m-cell {
  min-height: 100px; padding: 8px 8px 6px; border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; overflow: hidden;
}
.m-cell:nth-child(7n) { border-right: none; }
.m-cell:hover { background: rgba(229,77,46,.02); }
.m-cell.outside { opacity: .25; }
.m-cell.is-today { background: rgba(229,77,46,.03); }
.m-num {
  width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 4px;
}
.m-cell.is-today .m-num { background: var(--accent); color: #fff; }
.m-pill {
  display: block; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 600;
  margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.m-pill:hover { filter: brightness(.92); }
.m-more { font-size: 10px; color: var(--ink3); font-weight: 600; padding: 1px 2px; }

/* ══════════ MODAL ══════════ */
.overlay {
  position: fixed; inset: 0; background: rgba(28,25,23,.5);
  backdrop-filter: blur(10px); z-index: 900;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.overlay.open { opacity: 1; pointer-events: all; }
@media (min-width: 640px) { .overlay { align-items: center; } }

.modal {
  background: var(--surface); width: 100%; max-height: 92vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
  transform: translateY(40px); transition: transform .28s cubic-bezier(.34,1.1,.64,1);
}
.overlay.open .modal { transform: none; }
@media (min-width: 640px) {
  .modal { width: 480px; max-width: 96vw; border-radius: 20px; transform: translateY(20px) scale(.96); }
  .overlay.open .modal { transform: none; }
}
.modal-stripe { height: 3px; border-radius: 20px 20px 0 0; }
.modal-handle { width: 36px; height: 3px; background: var(--surface2); border-radius: 3px; margin: 12px auto 0; }
@media (min-width: 640px) { .modal-handle { display: none; } }
.modal-head { padding: 18px 22px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--font-serif); font-size: 1.25rem; color: var(--ink); }
.close-btn {
  width: 30px; height: 30px; background: var(--surface2); border: none; border-radius: 50%;
  cursor: pointer; color: var(--ink2); font-size: 13px; display: flex; align-items: center; justify-content: center;
  transition: all .13s;
}
.close-btn:hover { background: var(--ink); color: #fff; }
.modal-body { padding: 16px 22px; }
.modal-foot { padding: 10px 22px 22px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
@supports (padding-bottom: env(safe-area-inset-bottom)) { .modal-foot { padding-bottom: calc(22px + env(safe-area-inset-bottom)); } }

/* Form */
.fg { margin-bottom: 14px; }
.fl { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 7px; }
.fi {
  width: 100%; background: var(--surface2); border: 1.5px solid transparent; border-radius: 10px;
  padding: 11px 14px; font-family: var(--font); font-size: 14px; color: var(--ink); outline: none;
  transition: all .15s; -webkit-appearance: none;
}
.fi:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229,77,46,.1); }
.fi::placeholder { color: var(--ink3); }
select.fi { cursor: pointer; }
textarea.fi { resize: vertical; min-height: 70px; font-size: 13px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Swatches */
.sw-row { display: flex; gap: 8px; flex-wrap: wrap; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: all .13s; position: relative;
}
.sw:hover { transform: scale(1.12); }
.sw.on { border-color: var(--ink); transform: scale(1.1); }
.sw.on::after { content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.4); }

/* Day chips */
.dchips { display: flex; gap: 6px; flex-wrap: wrap; }
.dchip {
  padding: 6px 11px; background: var(--surface2); border: 1.5px solid var(--border2);
  border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink2);
  transition: all .13s; user-select: none; min-height: 34px; display: flex; align-items: center;
}
.dchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Modal buttons */
.btn-save {
  margin-left: auto; background: var(--accent); color: #fff; border: none; border-radius: 10px;
  padding: 11px 22px; font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 7px; transition: all .17s; min-height: 44px;
}
.btn-save:hover { background: var(--accent-d); }
.btn-del {
  background: none; border: 1.5px solid #fecdd3; color: #e11d48; border-radius: 10px;
  padding: 11px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: all .13s; min-height: 44px;
}
.btn-del:hover { background: #e11d48; color: #fff; border-color: #e11d48; }

/* ══════════ POPOVER ══════════ */
.pop-overlay {
  position: fixed; inset: 0; z-index: 950;
  display: none; align-items: flex-end;
}
.pop-overlay.open { display: flex; }
.pop-back { position: absolute; inset: 0; background: rgba(28,25,23,.3); backdrop-filter: blur(4px); }
.pop-card {
  position: absolute; background: var(--surface); border-radius: 16px 16px 0 0;
  width: 100%; box-shadow: var(--shadow-lg);
  animation: slideUp .2s cubic-bezier(.34,1.1,.64,1);
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) {
  .pop-overlay { align-items: center; justify-content: center; }
  .pop-card { position: relative; width: 300px; border-radius: 16px; }
}
.pop-stripe { height: 3px; border-radius: 16px 16px 0 0; }
@media (min-width: 640px) { .pop-stripe { border-radius: 16px 16px 0 0; } }
.pop-handle { width: 36px; height: 3px; background: var(--surface2); border-radius: 3px; margin: 10px auto; }
@media (min-width: 640px) { .pop-handle { display: none; } }
.pop-body { padding: 4px 18px 20px; }
@supports (padding-bottom: env(safe-area-inset-bottom)) { .pop-body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); } }
.pop-title { font-family: var(--font-serif); font-size: 1.1rem; color: var(--ink); margin-bottom: 8px; }
.pop-meta { font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.pop-meta i { color: var(--ink3); font-size: 12px; }
.pop-notes { font-size: 12px; color: var(--ink2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); white-space: pre-wrap; line-height: 1.6; }
.pop-actions { display: flex; gap: 8px; margin-top: 16px; }
.pop-btn {
  flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid var(--border2); background: var(--surface2); color: var(--ink2);
  transition: all .12s; min-height: 42px; font-family: var(--font);
}
.pop-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.pop-btn.danger:hover { background: #e11d48; color: #fff; border-color: #e11d48; }

/* ══════════ TOASTS ══════════ */
.toast-stack {
  position: fixed; z-index: 9999; bottom: 20px; right: 18px;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--ink); color: #fff; border-radius: 10px; padding: 11px 16px;
  font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 9px;
  box-shadow: var(--shadow-lg); animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.toast.ok .ti { color: #4ade80; }
.toast.err .ti { color: #f87171; }

/* ══════════════════════════════════════
   RESPONSIVE — mobile-first
   xs  : < 480px   (small phones)
   sm  : 480–767px (large phones / phablets)
   md  : 768–1023px (tablets)
   lg  : 1024px+   (desktop)
══════════════════════════════════════ */

/* ── MOBILE BOTTOM NAV ── */
.mob-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--surface); border-top: 1px solid var(--border);
  display: none; grid-template-columns: repeat(4, 1fr);
  height: 58px; padding-bottom: env(safe-area-inset-bottom);
}
.mob-nav-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border: none; background: none; cursor: pointer;
  color: var(--ink3); transition: color .13s; padding: 6px 0; font-family: var(--font);
}
.mob-nav-btn i { font-size: 20px; }
.mob-nav-btn span { font-size: 9px; font-weight: 600; letter-spacing: .04em; }
.mob-nav-btn.on { color: var(--accent); }
.mob-fab {
  background: var(--accent); color: #fff; border: none; border-radius: 50%;
  width: 48px; height: 48px; cursor: pointer; margin-top: -16px;
  display: flex; align-items: center; justify-content: center; font-size: 22px;
  box-shadow: 0 4px 16px rgba(229,77,46,.4); transition: all .17s;
  align-self: center; justify-self: center; flex-shrink: 0;
}
.mob-fab:active { transform: scale(.92); }

/* ── SIDEBAR BACKDROP ── */
.sb-back {
  display: none; position: fixed; inset: 0; z-index: 290;
  background: rgba(28,25,23,.5); backdrop-filter: blur(6px);
}

/* ── MOBILE (< 768px) ── */
@media (max-width: 767px) {
  /* Show bottom nav */
  .mob-nav { display: grid; }

  /* Sidebar slides in from left */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%); z-index: 300;
    width: 280px !important;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }

  /* Topbar */
  .topbar { padding: 0 14px; height: 52px; gap: 8px; }
  .btn-today { display: none; }
  .btn-secondary { display: none; }
  .btn-primary span { display: none; }
  .btn-primary { padding: 8px 10px; }
  .icon-btn[title="Import JSON"] { display: none; }
  .date-h { font-size: .95rem; max-width: 150px; }
  .date-s { display: none; }

  /* Hide desktop view strip — use bottom nav instead */
  .view-strip { display: none !important; }

  /* Content area leaves room for bottom nav */
  .content {
    padding: 10px 10px;
    padding-bottom: calc(58px + env(safe-area-inset-bottom) + 8px);
  }

  /* Day view — narrower time col */
  .day-time { width: 44px; }
  .tl { font-size: 8px; padding: 5px 6px 0; height: 56px; }
  .dhr { height: 56px; }
  .ev-block { left: 4px; right: 4px; padding: 4px 7px; font-size: 11px; border-radius: 7px; }
  .ev-block .ev-time { display: none; }

  /* Week view — compact */
  .wk-head { grid-template-columns: 36px repeat(7,1fr) !important; }
  .wk-grid { grid-template-columns: 36px repeat(7,1fr) !important; }
  .wk-hdcell { padding: 6px 2px; font-size: 8px; }
  .wk-num { font-size: .8rem !important; }
  .wk-hdcell.is-today .wk-num { width: 22px !important; height: 22px !important; font-size: .75rem !important; }
  .wk-tl { font-size: 7px; padding: 4px 4px 0; height: 44px; }
  .wk-cell { height: 44px; }
  .wk-ev { font-size: 8px; padding: 1px 3px; left: 1px; right: 1px; }

  /* Month view — compact cells */
  .m-cell { min-height: 56px; padding: 4px 3px 2px; }
  .m-num { width: 20px; height: 20px; font-size: 10px; margin-bottom: 2px; }
  .m-dlbl { font-size: 8px; padding: 6px 2px; }
  .m-pill { font-size: 8px; padding: 1px 3px; border-radius: 3px; }
  .m-more { font-size: 8px; }

  /* Modal full-screen bottom sheet */
  .modal { border-radius: 20px 20px 0 0; }
  .modal-body { padding: 12px 16px; }
  .modal-head { padding: 14px 16px 0; }
  .modal-foot { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); }

  /* Toast above bottom nav */
  .toast-stack { bottom: calc(58px + env(safe-area-inset-bottom) + 10px); left: 12px; right: 12px; }

  /* Alert banner full width */
  .alert-banner { padding: 8px 10px 0; }
  .alert-card { border-radius: 12px; padding: 12px 14px; }

  /* Popover full bottom sheet */
  .pop-card { border-radius: 20px 20px 0 0; }
}

/* ── SMALL PHONE (< 400px) ── */
@media (max-width: 400px) {
  .wk-hdcell { font-size: 7px; }
  .wk-num { font-size: .7rem !important; }
  .m-cell { min-height: 48px; }
  .frow { grid-template-columns: 1fr; }
  .timing-chips { gap: 4px; }
  .t-chip { padding: 5px 9px; font-size: 11px; }
}

/* ── TABLET (768px – 1023px) ── */
@media (min-width: 768px) and (max-width: 1023px) {
  /* Slim sidebar on tablet */
  .sidebar { width: 68px; flex-shrink: 0; }
  .sidebar .sb-btn span,
  .sidebar .mini-cal,
  .sidebar .cat-name,
  .sidebar .cat-count,
  .sidebar .sb-label,
  .sidebar .logo-name,
  .sidebar .btn-add-sb span { display: none; }
  .sidebar .sb-btn { justify-content: center; padding: 10px 0; }
  .sidebar .sb-btn i { width: auto; margin: 0; }
  .sidebar .cat-item { justify-content: center; padding: 7px 0; }
  .sidebar .logo-row { justify-content: center; }
  .sidebar .btn-add-sb { border-radius: 50%; width: 40px; height: 40px; padding: 0; justify-content: center; }
  .sidebar .sb-bottom { padding: 12px; display: flex; justify-content: center; }

  /* View strip visible on tablet */
  .view-strip { display: flex; }

  /* Topbar */
  .topbar { padding: 0 18px; }
  .btn-secondary span { display: none; }
  .btn-secondary { padding: 7px 10px; }

  /* Content */
  .content { padding: 14px 16px; }

  /* Month cells */
  .m-cell { min-height: 80px; }
}

/* ── DESKTOP (1024px+) ── */
@media (min-width: 1024px) {
  /* Hamburger toggles slim mode */
  .sidebar { transition: width .24s cubic-bezier(.4,0,.2,1); overflow: hidden; }
  .sidebar.slim { width: 68px; }
  .sidebar.slim .sb-btn span,
  .sidebar.slim .mc-title-wrap,
  .sidebar.slim .mini-cal,
  .sidebar.slim .cat-name,
  .sidebar.slim .cat-count,
  .sidebar.slim .sb-label,
  .sidebar.slim .logo-name,
  .sidebar.slim .btn-add-sb span { display: none; }
  .sidebar.slim .sb-btn { justify-content: center; padding: 9px 0; }
  .sidebar.slim .sb-btn i { width: auto; margin: 0; }
  .sidebar.slim .cat-item { justify-content: center; padding: 6px 0; }
  .sidebar.slim .logo-row { justify-content: center; }
  .sidebar.slim .btn-add-sb { border-radius: 50%; width: 40px; height: 40px; padding: 0; }
  .sidebar.slim .sb-bottom { padding: 12px; display: flex; justify-content: center; }

  /* Month cells taller on desktop */
  .m-cell { min-height: 110px; }
  .m-pill { font-size: 11px; }
}

/* ── REMINDER TOGGLE ── */
.reminder-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface2); border-radius: 10px; padding: 11px 14px;
  cursor: pointer; transition: background .13s; user-select: none;
}
.reminder-row:hover { background: var(--border); }
.reminder-label { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; color: var(--ink2); }
.reminder-label i { font-size: 15px; color: var(--ink3); }
.toggle-wrap { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0; background: var(--border2); border-radius: 22px;
  transition: background .2s; cursor: pointer;
}
.toggle-wrap input:checked + .toggle-track { background: var(--accent); }
.toggle-thumb {
  position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  background: #fff; border-radius: 50%; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2); pointer-events: none;
}
.toggle-wrap input:checked ~ .toggle-thumb { transform: translateX(18px); }

.reminder-timing {
  margin-top: 10px; display: none;
}
.reminder-timing.show { display: block; }
.timing-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.t-chip {
  padding: 6px 13px; background: var(--surface2); border: 1.5px solid var(--border2);
  border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--ink2); transition: all .13s; user-select: none;
}
.t-chip:hover { border-color: var(--accent); color: var(--accent); }
.t-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── IN-APP ALERT BANNER ── */
.alert-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  transform: translateY(-110%); transition: transform .35s cubic-bezier(.34,1.1,.64,1);
  display: flex; justify-content: center; pointer-events: none;
  padding: 12px 16px 0;
}
.alert-banner.show { transform: none; pointer-events: all; }
.alert-card {
  background: var(--ink); color: #fff; border-radius: 14px;
  padding: 14px 18px; max-width: 400px; width: 100%;
  box-shadow: var(--shadow-lg); display: flex; align-items: flex-start; gap: 13px;
}
.alert-icon {
  width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.alert-body { flex: 1; min-width: 0; }
.alert-sup { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 3px; }
.alert-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert-meta { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 2px; }
.alert-close {
  background: rgba(255,255,255,.1); border: none; color: rgba(255,255,255,.6);
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .12s;
}
.alert-close:hover { background: rgba(255,255,255,.2); color: #fff; }

/* bell badge on chips */
.chip-bell { font-size: 9px; opacity: .65; margin-left: 3px; vertical-align: middle; }

/* reminder meta in popover */
.pop-reminder { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); font-weight: 500; margin-top: 4px; }
.pop-reminder i { font-size: 12px; }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar backdrop (mobile) -->
  <div class="sb-back" id="sbBack"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="logo-row">
          <svg class="logo-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="34" height="34" rx="9" fill="#e54d2e"/>
            <!-- top bar hooks -->
            <rect x="10" y="6" width="3" height="6" rx="1.5" fill="white"/>
            <rect x="21" y="6" width="3" height="6" rx="1.5" fill="white"/>
            <!-- calendar body -->
            <rect x="5" y="10" width="24" height="19" rx="3" fill="white" fill-opacity="0.15"/>
            <rect x="5" y="10" width="24" height="5" rx="2" fill="white" fill-opacity="0.25"/>
            <!-- grid dots -->
            <rect x="9"  y="20" width="3" height="3" rx="1" fill="white" fill-opacity="0.9"/>
            <rect x="15.5" y="20" width="3" height="3" rx="1" fill="white" fill-opacity="0.9"/>
            <rect x="22" y="20" width="3" height="3" rx="1" fill="white" fill-opacity="0.4"/>
            <rect x="9"  y="26" width="3" height="3" rx="1" fill="white" fill-opacity="0.5"/>
            <rect x="15.5" y="26" width="3" height="3" rx="1" fill="white" fill-opacity="0.9"/>
            <rect x="22" y="26" width="3" height="3" rx="1" fill="white" fill-opacity="0.9"/>
          </svg>
        <span class="logo-name">Planr</span>
      </div>
    </div>

    <div class="mini-cal">
      <div class="mc-nav">
        <span class="mc-title" id="mcTitle"></span>
        <div style="display:flex;gap:2px">
          <button class="mc-btn" id="mcP">&#8249;</button>
          <button class="mc-btn" id="mcN">&#8250;</button>
        </div>
      </div>
      <div class="mc-grid" id="mcGrid"></div>
    </div>

    <div class="sb-nav">
      <div class="sb-section">
        <span class="sb-label">Views</span>
        <button class="sb-btn on" data-view="day"><i class="bi bi-sun"></i><span>Day</span></button>
        <button class="sb-btn" data-view="week"><i class="bi bi-calendar3-week"></i><span>Week</span></button>
        <button class="sb-btn" data-view="month"><i class="bi bi-calendar3"></i><span>Month</span></button>
      </div>
      <div class="sb-section">
        <span class="sb-label">Categories</span>
        <div id="catList"></div>
      </div>
    </div>

    <div class="sb-bottom">
      <button class="btn-add-sb" id="sbAdd"><i class="bi bi-plus-lg"></i><span>New Event</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <div class="tb-left">
        <button class="icon-btn ham" id="hamBtn"><i class="bi bi-list"></i></button>
        <button class="nav-btn" id="prevBtn"><i class="bi bi-chevron-left"></i></button>
        <button class="nav-btn" id="nextBtn"><i class="bi bi-chevron-right"></i></button>
        <button class="btn-today" id="todayBtn">Today</button>
        <div class="date-info">
          <div class="date-h" id="dateH"></div>
          <div class="date-s" id="dateS"></div>
        </div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" id="importBtn" title="Import JSON"><i class="bi bi-upload"></i></button>
        <input type="file" id="importFile" accept=".json" style="display:none"/>
        <button class="btn-secondary" id="excelBtn"><i class="bi bi-file-earmark-excel"></i><span>Export</span></button>
        <button class="btn-primary" id="addBtn"><i class="bi bi-plus-lg"></i><span>Add Event</span></button>
      </div>
    </div>

    <!-- View strip -->
    <div class="view-strip" id="viewStrip">
      <button class="v-tab on" data-view="day"><i class="bi bi-sun"></i> Day</button>
      <button class="v-tab" data-view="week"><i class="bi bi-calendar3-week"></i> Week</button>
      <button class="v-tab" data-view="month"><i class="bi bi-calendar3"></i> Month</button>
    </div>

    <!-- Panels -->
    <div class="content">
      <div class="panel on" id="dayPanel">
        <div class="day-layout">
          <div class="day-time" id="dayTime"></div>
          <div class="day-ev" id="dayEv"></div>
        </div>
      </div>
      <div class="panel" id="weekPanel">
        <div class="week-layout">
          <div class="wk-head" id="wkHead"></div>
          <div class="wk-scroll"><div class="wk-grid" id="wkGrid"></div></div>
        </div>
      </div>
      <div class="panel" id="monthPanel">
        <div class="month-layout">
          <div class="month-head" id="monthHead"></div>
          <div class="month-grid" id="monthGrid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile bottom nav -->
<nav class="mob-nav" id="mobNav">
  <button class="mob-nav-btn on" data-view="day"><i class="bi bi-sun"></i><span>Day</span></button>
  <button class="mob-nav-btn" data-view="week"><i class="bi bi-calendar3-week"></i><span>Week</span></button>
  <button class="mob-fab" id="fabBtn"><i class="bi bi-plus-lg"></i></button>
  <button class="mob-nav-btn" data-view="month"><i class="bi bi-calendar3"></i><span>Month</span></button>
</nav>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-stripe" id="mStripe"></div>
    <div class="modal-handle"></div>
    <div class="modal-head">
      <div class="modal-title" id="mTitle">New Event</div>
      <button class="close-btn" id="mClose"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="fl">Event title</label>
        <input class="fi" id="evTitle" placeholder="e.g. Morning standup, Gym, Study…"/>
      </div>
      <div class="fg">
        <label class="fl">Color</label>
        <div class="sw-row" id="swRow"></div>
      </div>
      <div class="frow fg">
        <div><label class="fl">Start</label><input type="time" class="fi" id="evStart" value="09:00"/></div>
        <div><label class="fl">End</label><input type="time" class="fi" id="evEnd" value="10:00"/></div>
      </div>
      <div class="fg">
        <label class="fl">Repeat</label>
        <select class="fi" id="evRepeat">
          <option value="once">One-time (specific date)</option>
          <option value="daily">Every day</option>
          <option value="weekly">Every week — same day</option>
          <option value="weekdays">Weekdays only (Mon–Fri)</option>
          <option value="monthly">Every month — same date</option>
          <option value="custom">Custom days</option>
        </select>
      </div>
      <div class="fg" id="dateFg">
        <label class="fl">Date</label>
        <input type="date" class="fi" id="evDate"/>
      </div>
      <div class="fg" id="customFg" style="display:none">
        <label class="fl">Pick days</label>
        <div class="dchips">
          <span class="dchip" data-d="0">Sun</span><span class="dchip" data-d="1">Mon</span>
          <span class="dchip" data-d="2">Tue</span><span class="dchip" data-d="3">Wed</span>
          <span class="dchip" data-d="4">Thu</span><span class="dchip" data-d="5">Fri</span>
          <span class="dchip" data-d="6">Sat</span>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Notes</label>
        <textarea class="fi" id="evNotes" placeholder="Optional details…"></textarea>
      </div>

      <div class="fg" style="margin-bottom:0">
        <label class="fl">Reminder</label>
        <div class="reminder-row" id="reminderRow">
          <div class="reminder-label">
            <i class="bi bi-bell"></i>
            <span>Notify me before this event</span>
          </div>
          <div class="toggle-wrap">
            <input type="checkbox" id="evReminder"/>
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </div>
        </div>
        <div class="reminder-timing" id="reminderTiming">
          <div class="timing-chips" id="timingChips">
            <span class="t-chip" data-m="5">5 min</span>
            <span class="t-chip on" data-m="10">10 min</span>
            <span class="t-chip" data-m="15">15 min</span>
            <span class="t-chip" data-m="30">30 min</span>
            <span class="t-chip" data-m="60">1 hour</span>
            <span class="t-chip" data-m="120">2 hours</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-del" id="mDel" style="display:none"><i class="bi bi-trash3"></i> Delete</button>
      <button class="btn-save" id="mSave"><i class="bi bi-check-lg"></i> Save</button>
    </div>
  </div>
</div>

<!-- IN-APP ALERT BANNER -->
<div class="alert-banner" id="alertBanner">
  <div class="alert-card">
    <div class="alert-icon" id="alertIcon"><i class="bi bi-bell-fill"></i></div>
    <div class="alert-body">
      <div class="alert-sup">Upcoming reminder</div>
      <div class="alert-title" id="alertTitle"></div>
      <div class="alert-meta" id="alertMeta"></div>
    </div>
    <button class="alert-close" id="alertClose"><i class="bi bi-x-lg"></i></button>
  </div>
</div>

<!-- POPOVER -->
<div class="pop-overlay" id="popOverlay">
  <div class="pop-back" id="popBack"></div>
  <div class="pop-card" id="popCard">
    <div class="pop-stripe" id="popStripe"></div>
    <div class="pop-handle"></div>
    <div class="pop-body">
      <div class="pop-title" id="popTitle"></div>
      <div class="pop-meta"><i class="bi bi-clock"></i><span id="popTime"></span></div>
      <div class="pop-meta"><i class="bi bi-arrow-repeat"></i><span id="popRpt"></span></div>
      <div class="pop-reminder" id="popReminder" style="display:none"><i class="bi bi-bell-fill"></i><span id="popReminderTxt"></span></div>
      <div class="pop-notes" id="popNotes" style="display:none"></div>
      <div class="pop-actions">
        <button class="pop-btn" id="popEdit"><i class="bi bi-pencil"></i> Edit</button>
        <button class="pop-btn danger" id="popDel"><i class="bi bi-trash3"></i> Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-stack" id="toastStack"></div>

<script>
'use strict';

const CATS = [
  { l:'Work',     c:'#e54d2e', bg:'#fff0ed' },
  { l:'Study',    c:'#2563eb', bg:'#eff6ff' },
  { l:'Health',   c:'#16a34a', bg:'#f0fdf4' },
  { l:'Personal', c:'#9333ea', bg:'#faf5ff' },
  { l:'Social',   c:'#ea580c', bg:'#fff7ed' },
  { l:'Travel',   c:'#0891b2', bg:'#ecfeff' },
  { l:'Finance',  c:'#d97706', bg:'#fffbeb' },
  { l:'Creative', c:'#db2777', bg:'#fdf2f8' },
];
const COLORS = CATS.map(x => x.c);
const DS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const RL = { once:'One-time', daily:'Every day', weekly:'Every week', weekdays:'Weekdays', monthly:'Every month', custom:'Custom days' };

let events = [], view = 'day', cursor = today0(), editId = null, selCol = COLORS[0], miniCur = new Date(today0()), popId = null;

function today0() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function pad(n) { return String(n).padStart(2,'0'); }
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function addDays(d, n) { const r = new Date(d); r.setDate(d.getDate() + n); return r; }
function weekStart(d) { const s = new Date(d); s.setDate(d.getDate() - d.getDay()); s.setHours(0,0,0,0); return s; }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function t2m(t) { if (!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtT(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`; }
function catOf(c) { return CATS.find(x => x.c === c) || CATS[0]; }
function isMob() { return window.innerWidth < 768; }

// Storage
function save() { try { localStorage.setItem('planr5', JSON.stringify(events)); } catch(e) {} }
function load() { try { const d = localStorage.getItem('planr5'); if (d) events = JSON.parse(d); } catch(e) { events = []; } }

// Occurrence
function occurs(ev, d) {
  const dow = d.getDay(), ds = dateStr(d);
  switch (ev.repeat) {
    case 'once':     return ev.date === ds;
    case 'daily':    return ds >= (ev.date || '0');
    case 'weekly': { if (!ev.date) return false; const o = new Date(ev.date+'T00:00:00'); return dow === o.getDay() && ds >= ev.date; }
    case 'weekdays': return dow >= 1 && dow <= 5 && ds >= (ev.date || '0');
    case 'monthly': { if (!ev.date) return false; const o = new Date(ev.date+'T00:00:00'); return d.getDate() === o.getDate() && ds >= ev.date; }
    case 'custom': return Array.isArray(ev.customDays) && ev.customDays.includes(dow) && ds >= (ev.date || '0');
    default: return false;
  }
}
function evFor(d) { return events.filter(ev => occurs(ev, d)).sort((a,b) => t2m(a.start) - t2m(b.start)); }

// Toast
function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="bi ${type==='ok'?'bi-check-circle':'bi-exclamation-circle'} ti"></i>${msg}`;
  document.getElementById('toastStack').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Sidebar
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sbBack').style.display = 'block';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbBack').style.display = 'none';
}
function handleHam() {
  if (window.innerWidth < 768) {
    // mobile — slide sidebar in/out
    const sb = document.getElementById('sidebar');
    if (sb.classList.contains('open')) closeSidebar();
    else openSidebar();
  } else {
    // tablet/desktop — toggle slim mode
    document.getElementById('sidebar').classList.toggle('slim');
  }
}

// Popover
function showPop(ev) {
  popId = ev.id;
  document.getElementById('popStripe').style.background = ev.color;
  document.getElementById('popTitle').textContent = ev.title;
  document.getElementById('popTime').textContent = `${fmtT(ev.start)} – ${fmtT(ev.end)}`;
  document.getElementById('popRpt').textContent = RL[ev.repeat] || '';
  const nEl = document.getElementById('popNotes');
  if (ev.notes) { nEl.textContent = ev.notes; nEl.style.display = 'block'; } else nEl.style.display = 'none';
  const rEl = document.getElementById('popReminder'), rTxt = document.getElementById('popReminderTxt');
  if (ev.reminder) { rTxt.textContent = TIMING_LABELS[ev.reminderMin] || `${ev.reminderMin} min before`; rEl.style.display = 'flex'; }
  else rEl.style.display = 'none';
  document.getElementById('popEdit').onclick = () => { closePop(); openModal(ev.id); };
  document.getElementById('popDel').onclick = () => { closePop(); delEvent(ev.id); };
  document.getElementById('popOverlay').classList.add('open');
}
function closePop() { document.getElementById('popOverlay').classList.remove('open'); popId = null; }

// View switch
function setView(v) {
  view = v;
  ['day','week','month'].forEach(vn => {
    document.querySelectorAll(`[data-view="${vn}"]`).forEach(el => el.classList.toggle('on', vn === v));
    const p = document.getElementById(vn+'Panel');
    if (p) p.classList.toggle('on', vn === v);
  });
  if (isMob()) closeSidebar();
  render();
}

// Navigate
function nav(dir) {
  if (view === 'day') cursor = addDays(cursor, dir);
  else if (view === 'week') cursor = addDays(cursor, dir*7);
  else cursor = new Date(cursor.getFullYear(), cursor.getMonth()+dir, 1);
  render();
}
function goToday() { cursor = today0(); miniCur = new Date(today0()); render(); }

// Labels
function updateLabels() {
  const dEl = document.getElementById('dateH'), sEl = document.getElementById('dateS');
  const td = today0();
  if (view === 'day') {
    dEl.textContent = sameDay(cursor,td) ? 'Today' : `${DL[cursor.getDay()]}, ${ML[cursor.getMonth()]} ${cursor.getDate()}`;
    sEl.textContent = cursor.getFullYear();
  } else if (view === 'week') {
    const s = weekStart(cursor), e = addDays(s, 6);
    dEl.textContent = s.getMonth()===e.getMonth()
      ? `${ML[s.getMonth()]} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`
      : `${ML[s.getMonth()].slice(0,3)} ${s.getDate()} – ${ML[e.getMonth()].slice(0,3)} ${e.getDate()}`;
    sEl.textContent = 'Week view';
  } else {
    dEl.textContent = `${ML[cursor.getMonth()]} ${cursor.getFullYear()}`;
    sEl.textContent = `${events.length} event${events.length===1?'':'s'}`;
  }
}

// ══════════ RENDER ══════════
function render() {
  updateLabels(); updateCats();
  if (view === 'day') renderDay();
  else if (view === 'week') renderWeek();
  else renderMonth();
  renderMini();
}

// DAY
function renderDay() {
  const tCol = document.getElementById('dayTime'), eCol = document.getElementById('dayEv');
  tCol.innerHTML = ''; eCol.innerHTML = '';
  const PX = isMob() ? 56 : 64;
  const TCW = isMob() ? 44 : 58;
  tCol.style.width = TCW + 'px';
  const dayEvs = evFor(cursor);
  for (let h = 0; h < 24; h++) {
    const lbl = document.createElement('div'); lbl.className = 'tl'; lbl.style.height = PX+'px';
    lbl.textContent = h ? fmtT(`${pad(h)}:00`) : '';
    tCol.appendChild(lbl);
    const row = document.createElement('div'); row.className = 'dhr'; row.style.height = PX+'px';
    const half = document.createElement('div'); half.className = 'dhr-half'; row.appendChild(half);
    row.addEventListener('click', () => quickAdd(cursor, h));
    eCol.appendChild(row);
  }
  if (!dayEvs.length) {
    const em = document.createElement('div'); em.className = 'empty-hint';
    em.innerHTML = '<i class="bi bi-calendar-plus"></i><p>Tap any time slot to add an event</p>';
    eCol.appendChild(em);
  }
  dayEvs.forEach(ev => {
    const sm = t2m(ev.start), em2 = Math.max(t2m(ev.end), sm+20);
    const top = (sm/60)*PX, h = Math.max(((em2-sm)/60)*PX, 24);
    const cat = catOf(ev.color);
    const chip = document.createElement('div'); chip.className = 'ev-block';
    chip.style.cssText = `top:${top}px;height:${h}px;background:${cat.bg};color:${cat.c};border-left-color:${cat.c}`;
    chip.innerHTML = `<span class="ev-title">${ev.title}${ev.reminder?` <i class="bi bi-bell-fill chip-bell"></i>`:''}</span>${h>36?`<span class="ev-time">${fmtT(ev.start)} – ${fmtT(ev.end)}</span>`:''}`;
    chip.addEventListener('click', e => { e.stopPropagation(); showPop(ev); });
    eCol.appendChild(chip);
  });
  if (sameDay(cursor, today0())) {
    const now = new Date();
    const line = document.createElement('div'); line.className = 'now-line';
    line.style.top = ((now.getHours()*60+now.getMinutes())/60*PX)+'px';
    eCol.appendChild(line);
  }
}

// WEEK
function renderWeek() {
  const head = document.getElementById('wkHead'), grid = document.getElementById('wkGrid');
  head.innerHTML = ''; grid.innerHTML = '';
  const ws = weekStart(cursor), td = today0();
  const mob = isMob();
  const PX = mob ? 44 : 52;
  const TCW = mob ? 36 : 58;
  const cols = `${TCW}px repeat(7,1fr)`;
  head.style.gridTemplateColumns = cols;
  grid.style.gridTemplateColumns = cols;
  const c0 = document.createElement('div'); c0.className = 'wk-hd0'; head.appendChild(c0);
  for (let d = 0; d < 7; d++) {
    const day = addDays(ws, d), isT = sameDay(day, td);
    const cell = document.createElement('div'); cell.className = 'wk-hdcell' + (isT ? ' is-today' : '');
    const num = document.createElement('span'); num.className = 'wk-num'; num.textContent = day.getDate();
    cell.textContent = mob ? DS[day.getDay()][0] : DS[day.getDay()].slice(0,3);
    cell.appendChild(num); head.appendChild(cell);
  }
  for (let h = 0; h < 24; h++) {
    const lbl = document.createElement('div'); lbl.className = 'wk-tl'; lbl.style.height = PX+'px';
    lbl.textContent = h ? fmtT(`${pad(h)}:00`) : '';
    grid.appendChild(lbl);
    for (let d = 0; d < 7; d++) {
      const day = addDays(ws, d);
      const cell = document.createElement('div'); cell.className = 'wk-cell'; cell.style.height = PX+'px';
      if (d===6) cell.style.borderRight = 'none';
      cell.addEventListener('click', () => quickAdd(day, h));
      grid.appendChild(cell);
    }
  }
  for (let d = 0; d < 7; d++) {
    const day = addDays(ws, d);
    evFor(day).forEach(ev => {
      const sm = t2m(ev.start), em2 = Math.max(t2m(ev.end), sm+15);
      const top = (sm/60)*PX, h = Math.max(((em2-sm)/60)*PX, 14);
      const cat = catOf(ev.color);
      const wrap = document.createElement('div');
      wrap.style.cssText = `position:relative;height:0;overflow:visible;grid-column:${d+2};grid-row:${Math.floor(sm/60)+2}`;
      const chip = document.createElement('div'); chip.className = 'wk-ev';
      chip.style.cssText = `top:${(sm%60/60)*PX}px;height:${h}px;background:${cat.bg};color:${cat.c};border-left-color:${cat.c}`;
      chip.innerHTML = ev.title + (ev.reminder ? ' <i class="bi bi-bell-fill chip-bell"></i>' : '');
      chip.addEventListener('click', e => { e.stopPropagation(); showPop(ev); });
      wrap.appendChild(chip); grid.appendChild(wrap);
    });
    if (sameDay(addDays(ws,d), td)) {
      const now = new Date(), top = ((now.getHours()*60+now.getMinutes())/60)*PX;
      const wrap = document.createElement('div');
      wrap.style.cssText = `position:relative;height:0;overflow:visible;grid-column:${d+2};grid-row:${Math.floor((now.getHours()*60+now.getMinutes())/60)+2}`;
      const line = document.createElement('div'); line.className = 'now-line'; line.style.top = `${(now.getMinutes()/60)*PX}px`;
      wrap.appendChild(line); grid.appendChild(wrap);
    }
  }
}

// MONTH
function renderMonth() {
  const headEl = document.getElementById('monthHead'), gridEl = document.getElementById('monthGrid');
  if (!headEl.children.length) {
    DS.forEach(d => { const e = document.createElement('div'); e.className = 'm-dlbl'; e.textContent = d.slice(0,3); headEl.appendChild(e); });
  }
  gridEl.innerHTML = '';
  const td = today0(), y = cursor.getFullYear(), m = cursor.getMonth();
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const cells = [];
  for (let i = first.getDay()-1; i >= 0; i--) cells.push({ d: addDays(first,-i-1), out: true });
  for (let i = 1; i <= last.getDate(); i++) cells.push({ d: new Date(y,m,i), out: false });
  const rem = cells.length%7; if (rem) for (let i = 1; i <= 7-rem; i++) cells.push({ d: new Date(y,m+1,i), out: true });
  cells.forEach(({ d, out }) => {
    const cell = document.createElement('div'); const isT = sameDay(d,td);
    cell.className = 'm-cell' + (out?' outside':'') + (isT?' is-today':'');
    const num = document.createElement('div'); num.className = 'm-num'; num.textContent = d.getDate(); cell.appendChild(num);
    const all = evFor(d);
    const mob = isMob();
    if (mob) {
      // dot indicators on mobile
      if (all.length) {
        const dotRow = document.createElement('div');
        dotRow.style.cssText = 'display:flex;gap:2px;flex-wrap:wrap;padding:0 2px';
        all.slice(0,4).forEach(ev => {
          const dot = document.createElement('span');
          dot.style.cssText = `width:5px;height:5px;border-radius:50%;background:${ev.color};flex-shrink:0;display:inline-block`;
          dotRow.appendChild(dot);
        });
        cell.appendChild(dotRow);
      }
    } else {
      all.slice(0,3).forEach(ev => {
        const cat = catOf(ev.color);
        const pill = document.createElement('span'); pill.className = 'm-pill';
        pill.style.cssText = `background:${cat.bg};color:${cat.c}`;
        pill.textContent = ev.title;
        pill.addEventListener('click', e => { e.stopPropagation(); showPop(ev); });
        cell.appendChild(pill);
      });
      if (all.length > 3) { const more = document.createElement('div'); more.className = 'm-more'; more.textContent = `+${all.length-3} more`; cell.appendChild(more); }
    }
    cell.addEventListener('click', e => { if (e.target.closest('.m-pill')) return; cursor = new Date(d); setView('day'); });
    gridEl.appendChild(cell);
  });
}

// Mini cal
function renderMini() {
  const g = document.getElementById('mcGrid'); g.innerHTML = '';
  document.getElementById('mcTitle').textContent = `${ML[miniCur.getMonth()].slice(0,3).toUpperCase()} ${miniCur.getFullYear()}`;
  const td = today0(), y = miniCur.getFullYear(), m = miniCur.getMonth();
  DS.forEach(d => { const el = document.createElement('div'); el.className = 'mc-dlbl'; el.textContent = d[0]; g.appendChild(el); });
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const cells = [];
  for (let i = first.getDay()-1; i >= 0; i--) cells.push({ d: addDays(first,-i-1), out: true });
  for (let i = 1; i <= last.getDate(); i++) cells.push({ d: new Date(y,m,i), out: false });
  const rem = cells.length%7; if (rem) for (let i = 1; i <= 7-rem; i++) cells.push({ d: new Date(y,m+1,i), out: true });
  cells.forEach(({ d, out }) => {
    const el = document.createElement('div');
    el.className = 'mc-day' + (out?' out':'') + (sameDay(d,td)?' today':'') + (sameDay(d,cursor)&&!sameDay(d,td)?' sel':'');
    if (evFor(d).length && !out) el.classList.add('has');
    el.textContent = d.getDate();
    el.addEventListener('click', () => { cursor = new Date(d); if (view!=='day') setView('day'); else render(); });
    g.appendChild(el);
  });
}

// Categories
function updateCats() {
  const list = document.getElementById('catList'); list.innerHTML = '';
  CATS.forEach(cat => {
    const n = events.filter(ev => ev.color === cat.c).length;
    const el = document.createElement('div'); el.className = 'cat-item';
    el.innerHTML = `<div class="cat-dot" style="background:${cat.c}"></div><span class="cat-name">${cat.l}</span>${n?`<span class="cat-count">${n}</span>`:''}`;
    list.appendChild(el);
  });
}

// Quick add
function quickAdd(date, hour) { openModal(null, { date: dateStr(date), start: `${pad(hour)}:00`, end: `${pad(Math.min(hour+1,23))}:00` }); }

// ══════════ MODAL ══════════
function openModal(id=null, pre={}) {
  editId = id; const ev = id ? events.find(e => e.id===id) : null;
  document.getElementById('mTitle').textContent = ev ? 'Edit Event' : 'New Event';
  document.getElementById('mDel').style.display = ev ? 'flex' : 'none';
  document.getElementById('evTitle').value = ev?.title || '';
  document.getElementById('evStart').value = ev?.start || pre.start || '09:00';
  document.getElementById('evEnd').value = ev?.end || pre.end || '10:00';
  document.getElementById('evRepeat').value = ev?.repeat || 'once';
  document.getElementById('evDate').value = ev?.date || pre.date || dateStr(today0());
  document.getElementById('evNotes').value = ev?.notes || '';
  selCol = ev?.color || COLORS[0];
  // Reminder state
  const hasReminder = !!ev?.reminder;
  selReminderMin = ev?.reminderMin || 10;
  document.getElementById('evReminder').checked = hasReminder;
  document.getElementById('reminderTiming').classList.toggle('show', hasReminder);
  document.querySelectorAll('.t-chip').forEach(c => c.classList.toggle('on', parseInt(c.dataset.m) === selReminderMin));
  buildSwatches(); updateRepeatUI(); setDays(ev?.customDays || []);
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('evTitle').focus(), 280);
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function buildSwatches() {
  const row = document.getElementById('swRow'); row.innerHTML = '';
  CATS.forEach(cat => {
    const sw = document.createElement('div'); sw.className = 'sw' + (cat.c===selCol?' on':'');
    sw.style.background = cat.c; sw.title = cat.l;
    sw.addEventListener('click', () => { selCol = cat.c; buildSwatches(); document.getElementById('mStripe').style.background = cat.c; });
    row.appendChild(sw);
  });
  document.getElementById('mStripe').style.background = selCol;
}

function updateRepeatUI() {
  const v = document.getElementById('evRepeat').value;
  document.getElementById('dateFg').style.display = (v==='daily'||v==='weekdays') ? 'none' : 'block';
  document.getElementById('customFg').style.display = v==='custom' ? 'block' : 'none';
}

function setDays(days) { document.querySelectorAll('.dchip').forEach(c => c.classList.toggle('on', days.includes(parseInt(c.dataset.d)))); }

function saveEvent() {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { toast('Please enter a title', 'err'); return; }
  const start = document.getElementById('evStart').value, end = document.getElementById('evEnd').value;
  const repeat = document.getElementById('evRepeat').value, date = document.getElementById('evDate').value;
  const notes = document.getElementById('evNotes').value.trim();
  if (t2m(end) <= t2m(start)) { toast('End time must be after start', 'err'); return; }
  let customDays = [];
  if (repeat === 'custom') {
    document.querySelectorAll('.dchip.on').forEach(c => customDays.push(parseInt(c.dataset.d)));
    if (!customDays.length) { toast('Select at least one day', 'err'); return; }
  }
  const evData = { id: editId || uid(), title, start, end, repeat, date, notes, color: selCol, customDays,
    reminder: document.getElementById('evReminder').checked,
    reminderMin: selReminderMin
  };
  if (editId) { const i = events.findIndex(e => e.id===editId); if (i>-1) events[i] = evData; toast('Updated'); }
  else { events.push(evData); toast('Event saved'); }
  save(); closeModal(); render();
  scheduleAllReminders();
}

function delEvent(id) {
  if (!confirm('Delete this event?')) return;
  events = events.filter(e => e.id !== id); save(); render(); toast('Deleted');
  scheduleAllReminders();
}

// Export Excel
function exportExcel() {
  if (!events.length) { toast('No events to export', 'err'); return; }
  const wb = XLSX.utils.book_new();
  const rows = [['#','Title','Category','Start','End','Repeat','Date','Custom Days','Notes']];
  events.forEach((ev,i) => rows.push([i+1, ev.title, catOf(ev.color).l, fmtT(ev.start), fmtT(ev.end), RL[ev.repeat]||ev.repeat, ev.date||'—', (ev.customDays||[]).map(d=>DS[d]).join(', ')||'—', ev.notes||'']));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:4},{wch:28},{wch:12},{wch:11},{wch:11},{wch:22},{wch:13},{wch:20},{wch:35}];
  XLSX.utils.book_append_sheet(wb, ws, 'Events');
  XLSX.writeFile(wb, `Planr_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel exported');
}

// Import
function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (!Array.isArray(d)) throw 0; events = d; save(); render(); toast(`Imported ${events.length} events`); } catch { toast('Invalid file','err'); } };
  r.readAsText(file); e.target.value = '';
}

// ══════════ REMINDER ENGINE ══════════

const TIMING_LABELS = { 5:'5 min before', 10:'10 min before', 15:'15 min before', 30:'30 min before', 60:'1 hour before', 120:'2 hours before' };
let notifPermission = 'default';
let reminderTimers = {}; // eventId → timer ids array
let alertTimeout = null;

function requestNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') { notifPermission = 'granted'; return; }
  if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => { notifPermission = p; });
  } else {
    notifPermission = Notification.permission;
  }
}

function showInAppAlert(ev) {
  const cat = catOf(ev.color);
  document.getElementById('alertIcon').style.background = cat.bg;
  document.getElementById('alertIcon').style.color = cat.c;
  document.getElementById('alertTitle').textContent = ev.title;
  document.getElementById('alertMeta').textContent = `Starts at ${fmtT(ev.start)}`;
  const banner = document.getElementById('alertBanner');
  banner.classList.add('show');
  if (alertTimeout) clearTimeout(alertTimeout);
  alertTimeout = setTimeout(() => banner.classList.remove('show'), 8000);
}

function fireReminder(ev) {
  showInAppAlert(ev);
  if (notifPermission === 'granted') {
    try {
      new Notification(`⏰ ${ev.title}`, {
        body: `Starts at ${fmtT(ev.start)}`,
        icon: 'https://cdn-icons-png.flaticon.com/512/1836/1836327.png',
        badge: 'https://cdn-icons-png.flaticon.com/512/1836/1836327.png',
        tag: `planr-${ev.id}`,
        renotify: true,
      });
    } catch(e) {}
  }
}

function scheduleRemindersForDay(d) {
  // Clear all existing timers first
  Object.values(reminderTimers).flat().forEach(t => clearTimeout(t));
  reminderTimers = {};

  const now = new Date();
  const evs = evFor(d).filter(ev => ev.reminder);
  evs.forEach(ev => {
    const [h, m] = ev.start.split(':').map(Number);
    const fireTime = new Date(d);
    fireTime.setHours(h, m - (ev.reminderMin || 10), 0, 0);
    const ms = fireTime - now;
    if (ms > 0 && ms < 24 * 60 * 60 * 1000) {
      const t = setTimeout(() => fireReminder(ev), ms);
      reminderTimers[ev.id] = [t];
    }
  });
}

function scheduleAllReminders() {
  const td = today0();
  scheduleRemindersForDay(td);
}

// Reminder toggle in modal
let selReminderMin = 10;

function initReminderUI() {
  const toggle = document.getElementById('evReminder');
  const timingEl = document.getElementById('reminderTiming');
  const reminderRow = document.getElementById('reminderRow');

  reminderRow.addEventListener('click', e => {
    if (e.target.closest('.toggle-wrap')) return;
    toggle.checked = !toggle.checked;
    toggle.dispatchEvent(new Event('change'));
  });

  toggle.addEventListener('change', () => {
    timingEl.classList.toggle('show', toggle.checked);
    if (toggle.checked && notifPermission !== 'granted') requestNotifPermission();
  });

  document.querySelectorAll('.t-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.t-chip').forEach(c => c.classList.remove('on'));
      chip.classList.add('on');
      selReminderMin = parseInt(chip.dataset.m);
    });
  });
}

  document.getElementById('mSave').addEventListener('click', saveEvent);
  document.getElementById('mDel').addEventListener('click', () => { if (editId) { closeModal(); delEvent(editId); } });
  document.getElementById('evRepeat').addEventListener('change', updateRepeatUI);
  document.getElementById('evTitle').addEventListener('keydown', e => { if (e.key === 'Enter') saveEvent(); });
  document.querySelectorAll('.dchip').forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));

  document.getElementById('excelBtn').addEventListener('click', exportExcel);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importJSON);

  // Reminder
  initReminderUI();
  requestNotifPermission();
  document.getElementById('alertClose').addEventListener('click', () => {
    document.getElementById('alertBanner').classList.remove('show');
    if (alertTimeout) clearTimeout(alertTimeout);
  });

  if (!events.length) seed();
  render();
  scheduleAllReminders();
  setInterval(() => { if (sameDay(cursor, today0())) render(); scheduleAllReminders(); }, 60000);
});
